<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SentryReport logo — D slick</title>
    <style>
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background: #f4f7fa;
        color: #152033;
        padding: 32px 20px 64px;
      }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { margin: 0 0 28px; color: #4a5a6a; }
      .grid { display: grid; gap: 24px; max-width: 920px; }
      figure {
        margin: 0;
        background: #fff;
        border: 1px solid #d8e0e8;
        border-radius: 12px;
        overflow: hidden;
      }
      figcaption {
        padding: 12px 16px;
        font-size: 0.9rem;
        border-top: 1px solid #d8e0e8;
      }
      img { display: block; width: 100%; height: auto; background: #e8eef3; }
    </style>
  </head>
  <body>
    <h1>D — slicker lockup</h1>
    <p>
      Same idea as D: navy tile + shield/eye + SentryReport. Tighter type, outline
      mark. Also already applied in the app header.
    </p>
    <div class="grid">
      <figure>
        <img src="sentry-logo-d-slick.png" alt="Slick D lockup" />
        <figcaption><strong>Lockup</strong> · Sentry + Report weights</figcaption>
      </figure>
      <figure>
        <img src="sentry-logo-d-slick-mark.png" alt="Slick D app icon" />
        <figcaption><strong>Mark</strong> · header / favicon</figcaption>
      </figure>
    </div>
  </body>
</html>
